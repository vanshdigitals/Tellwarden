[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tellwarden"
version = "0.1.0"
description = "Educational cybersecurity workspace: web security scanner and offline rule-based IDS simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Tellwarden Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.38.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "pip-audit>=2.7.0",
    "ruff>=0.5.0",
    "playwright>=1.48.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "unit: fast unit tests",
    "integration: integration tests",
    "docs: documentation consistency tests"
]
